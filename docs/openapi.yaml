        '200':
          description: 新建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminRoute'

  /api/v1/admin/routes/{id}:
    put:
      tags: [管理端-配置]
      summary: 修改线路
      parameters:
