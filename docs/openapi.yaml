        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 盲盒分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedBoxResult'
    post:
      tags: [管理端-配置]
      summary: 新增盲盒
      description: 保存时校验同分类启用线路中是否存在满足保底的线路，不满足时返回告警字段但允许保存。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoxUpsert'
      responses:
        '200':
          description: 新建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminBox'

