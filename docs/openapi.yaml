          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: true

  /api/v1/admin/configs:
    get:
      tags: [管理端-工作台与统计]
      summary: 读取系统配置
      responses:
        '200':
          description: 系统配置键值
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        additionalProperties: true
    put:
      tags: [管理端-工作台与统计]
      summary: 更新系统配置
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'

  /api/v1/admin/admins:
    get:
      tags: [管理端-工作台与统计]
      summary: 后台账号列表
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 账号分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAdminAccountResult'
    post:
      tags: [管理端-工作台与统计]
      summary: 新增后台账号
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, password, role]
              properties:
                account:
                  type: string
                password:
                  type: string
                role:
                  $ref: '#/components/schemas/AdminRole'
                name:
                  type: string
      responses:
        '200':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'

  /api/v1/admin/admins/{id}:
    put:
      tags: [管理端-工作台与统计]
      summary: 修改后台账号（含角色与启停）
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                role:
                  $ref: '#/components/schemas/AdminRole'
                status:
                  type: string
                  enum: [active, disabled]
                password:
                  type: string
                  description: 传了就改密，不传则不动
      responses:
        '200':
          description: 已修改
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'

  /api/v1/admin/audit-logs:
    get:
      tags: [管理端-工作台与统计]
      summary: 操作日志
      parameters:
        - name: adminId
          in: query
          schema:
            type: integer
        - name: action
          in: query
          schema:
            type: string
            description: 如 box_update / route_update / refund_approve / user_disable
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 操作日志分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAuditLogResult'

components:
  securitySchemes:
    UserToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 用户端 JWT，前缀 /api/v1
    AdminToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 管理端 JWT，前缀 /api/v1/admin

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    OrderNo:
      name: orderNo
      in: path
      required: true
      schema:
        type: string
        example: T20260917001234
    RefundNo:
      name: refundNo
      in: path
      required: true
      schema:
        type: string
        example: R20260917001001
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    StatusQuery:
      name: status
      in: query
      schema:
        type: string
        enum: [pending_pay, paid, opened, cancelled, refunded]
    DateRangeBegin:
      name: begin
      in: query
      schema:
        type: string
        format: date
        example: '2026-09-01'
    DateRangeEnd:
      name: end
      in: query
      schema:
        type: string
        format: date
        example: '2026-09-18'

  responses:
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'
    Unauthorized:
      description: 未登录或 Token 失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'
    Forbidden:
      description: 无权限或账号被禁用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'
    Conflict:
      description: 状态冲突，当前状态不允许该操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'

  schemas:
    # ── 公共 ──
    Result:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          nullable: true
    ResultVoid:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
        data:
          nullable: true
    ResultString:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: string

    Category:
      type: string
      description: 周边游 / 省内游 / 跨省游 / 主题专线
      enum: [nearby, province, cross, theme]
    Mood:
      type: string
      description: 开心 / emo / 无聊 / 迷茫
      enum: [happy, emo, bored, curious]

    # ── 用户端 ──
    LoginResult:
      type: object
      properties:
        token:
          type: string
        isNewUser:
          type: boolean
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nickname:
          type: string
        avatarUrl:
          type: string
          nullable: true
        gender:
          type: integer
          enum: [0, 1, 2]
        city:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
          description: 脱敏，如 138****8000
        hasPhone:
          type: boolean
        wechatOpenidBound:
          type: boolean
        title:
          type: string
          description: 称号，按出行次数套 level.rules 算出，不落库
          example: 探索者
        personalityType:
          type: string
          nullable: true
          enum: [nature, city, adventure, culture, null]

    Banner:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        subTitle:
          type: string
        tag:
          type: string
        imageUrl:
          type: string
        jumpType:
          type: string
          enum: [none, category, box, url]
        jumpTarget:
          type: string
          nullable: true

    BlindBox:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        tag:
          type: string
          description: 展示用分类标签，如「周边游」
        rankTag:
          type: string
          nullable: true
          description: 角标，如 TOP1 / HOT / NEW
        intro:
          type: string
        price:
          type: number
          description: 售价（元）
          example: 99
        minValue:
          type: number
          description: 保底票面（元）
          example: 120
        coverUrl:
          type: string
        moods:
          type: array
          items:
            $ref: '#/components/schemas/Mood'
        status:
          type: string
          enum: [on, off]

    Badge:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: 古村
        mark:
          type: string
          description: 印章内的单字
          example: 村
        description:
          type: string
        unlocked:
          type: boolean
        unlockedAt:
          type: string
          nullable: true

    PersonalityQuestion:
      type: object
      properties:
        id:
          type: integer
        sortNo:
          type: integer
        question:
          type: string
        options:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              text:
                type: string

    PersonalityResult:
      type: object
      properties:
        type:
          type: string
          enum: [nature, city, adventure, culture]
        name:
          type: string
          example: 山野治愈家
        mark:
          type: string
          example: 野
        description:
          type: string
        recommend:
          type: string

    AiConfig:
      type: object
      properties:
        greet:
          type: string
        quickQuestions:
          type: array
          items:
            type: string

    ChatMessage:
      type: object
      properties:
        id:
          type: integer
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        fallback:
          type: boolean
        createdAt:
          type: string

    AiReply:
      type: object
      properties:
        content:
          type: string
        fallback:
          type: boolean
          description: true 表示走了关键词 / 默认话术降级
        recommendBoxes:
          type: array
          items:
            $ref: '#/components/schemas/BlindBox'
        sessionId:
          type: string
          nullable: true

    OrderCreated:
      type: object
      properties:
        orderNo:
          type: string
        amount:
          type: number
        expireAt:
          type: string

    PayRedirect:
      type: object
      properties:
        channel:
          type: string
          enum: [alipay, mock]
        payUrl:
          type: string
          description: 沙箱收银台地址，供外部浏览器 / 二维码使用
        payForm:
          type: string
          nullable: true
          description: 支付宝返回的表单 HTML；H5 场景可直接提交
        qrCodeUrl:
          type: string
          nullable: true
          description: 后端渲染的支付二维码图片地址
        expireAt:
          type: string

    OrderDetail:
      type: object
      properties:
        orderNo:
          type: string
        status:
          type: string
          enum: [pending_pay, paid, opened, cancelled, refunded]
        boxId:
          type: integer
        boxName:
          type: string
          description: 下单时快照
        boxCategory:
          $ref: '#/components/schemas/Category'
        amount:
          type: number
        payChannel:
          type: string
          nullable: true
          enum: [alipay, mock, null]
        paidAt:
          type: string
          nullable: true
        expireAt:
          type: string
        createdAt:
          type: string
        trip:
          allOf:
            - $ref: '#/components/schemas/Trip'
          nullable: true
        refundStatus:
          type: string
          nullable: true
          enum: [pending_review, refunding, refunded, rejected, null]

    Trip:
      type: object
      properties:
        id:
          type: integer
        orderNo:
          type: string
        boxName:
          type: string
        boxCategory:
          $ref: '#/components/schemas/Category'
        routeName:
          type: string
          description: 开盒时快照
        destination:
          type: string
        value:
          type: number
          description: 票面价值（元）
        price:
          type: number
          description: 购入价（元）
        badgeName:
          type: string
        badgeMark:
          type: string
        moodText:
          type: string
        highlights:
          type: string
        includes:
          type: array
          items:
            type: string
        openedAt:
          type: string
        validity:
          type: boolean
          description: false 表示已随退款失效
        diaryText:
          type: string
          nullable: true

    UserStats:
      type: object
      description: 口径见数据库设计 §5
      properties:
        tripCount:
          type: integer
          description: 有效行程数
        savedTotal:
          type: number
          description: 累计省钱 = Σ(票面 − 购入价)，仅有效行程
        title:
          type: string
        welfareKm:
          type: number
          description: 公益里程，按有效行程累计
        badgeUnlocked:
          type: integer
        badgeTotal:
          type: integer
        personalityType:
          type: string
          nullable: true
        destinations:
          type: array
          items:
            type: string
        spendTotal:
          type: number
          description: 累计消费，仅支付成功且未退款
        recentMood:
          $ref: '#/components/schemas/Mood'
          nullable: true
        favoriteCategory:
          $ref: '#/components/schemas/Category'
          nullable: true
        monthTrips:
          type: integer
        diaryCount:
          type: integer

    # ── 管理端 ──
    AdminRole:
      type: string
      enum: [super_admin, operator, cs, finance, analyst]

    AdminProfile:
      type: object
      properties:
        id:
          type: integer
        account:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/AdminRole'

    AdminBox:
      allOf:
        - $ref: '#/components/schemas/BlindBox'
        - type: object
          properties:
            sortWeight:
              type: integer
            openCount:
              type: integer
            createdAt:
              type: string
            updatedAt:
              type: string

    BoxUpsert:
      type: object
      required: [name, category, price, minValue]
      properties:
        name:
          type: string
          maxLength: 64
        category:
          $ref: '#/components/schemas/Category'
        tag:
          type: string
        rankTag:
          type: string
          nullable: true
        intro:
          type: string
          maxLength: 255
        price:
          type: number
          description: 元，最多两位小数
        minValue:
          type: number
        coverUrl:
          type: string
        moods:
          type: array
          items:
            $ref: '#/components/schemas/Mood'
        sortWeight:
          type: integer
        status:
          type: string
          enum: [on, off]

    AdminRoute:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        destination:
          type: string
        value:
          type: number
        cost:
          type: number
          nullable: true
          description: 采购结算价，本期可空
        badgeId:
          type: integer
        badgeName:
          type: string
        badges:
          type: array
          description: 管理端详情可展示多位徽章
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              mark:
                type: string
        highlight:
          type: string
        includes:
          type: array
          items:
            type: string
        moodText:
          type: string
        status:
          type: string
          enum: [on, off]
        drawCount:
          type: integer

    RouteUpsert:
      type: object
      required: [name, category, destination, value]
      properties:
        name:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        destination:
          type: string
        value:
          type: number
        cost:
          type: number
          nullable: true
        badgeId:
          type: integer
        highlight:
          type: string
        includes:
          type: array
          items:
            type: string
        moodText:
          type: string
        status:
          type: string
          enum: [on, off]

    BadgeUpsert:
      type: object
      required: [name, mark]
      properties:
        name:
          type: string
          maxLength: 32
        mark:
          type: string
          maxLength: 4
        description:
          type: string
          maxLength: 255
        sortWeight:
          type: integer

    BannerUpsert:
      type: object
      required: [title, jumpType]
      properties:
        title:
          type: string
        subTitle:
          type: string
        tag:
          type: string
        imageUrl:
          type: string
        jumpType:
          type: string
          enum: [none, category, box, url]
        jumpTarget:
          type: string
          nullable: true
        startAt:
          type: string
          nullable: true
        endAt:
          type: string
          nullable: true
        sortWeight:
          type: integer
        status:
          type: string
          enum: [on, off]

    AdminOrder:
      type: object
      properties:
        orderNo:
          type: string
        userName:
          type: string
        phone:
          type: string
          description: 脱敏
        boxName:
          type: string
        amount:
          type: number
        paidAmount:
          type: number
          nullable: true
        channel:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending_pay, paid, opened, cancelled, refunded]
        routeName:
          type: string
          nullable: true
        createdAt:
          type: string

    AdminOrderDetail:
      allOf:
        - $ref: '#/components/schemas/AdminOrder'
        - type: object
          properties:
            userId:
              type: integer
            boxSnapshot:
              type: object
              properties:
                boxId:
                  type: integer
                name:
                  type: string
                category:
                  $ref: '#/components/schemas/Category'
                price:
                  type: number
                minValue:
                  type: number
            payment:
              allOf:
                - $ref: '#/components/schemas/PayFlow'
              nullable: true
            trip:
              allOf:
                - $ref: '#/components/schemas/Trip'
              nullable: true
            refund:
              allOf:
                - $ref: '#/components/schemas/RefundDetail'
              nullable: true

    PayFlow:
      type: object
      properties:
        flowNo:
          type: string
        orderNo:
          type: string
        channel:
          type: string
          enum: [alipay, mock]
        outerTradeNo:
          type: string
          nullable: true
        amount:
          type: number
        result:
          type: string
          enum: [success, fail]
        failReason:
          type: string
          nullable: true
        createdAt:
          type: string

    RefundDetail:
      type: object
      properties:
        refundNo:
          type: string
        orderNo:
          type: string
        userName:
          type: string
        kind:
          type: string
          enum: [value_guard, unused, draw_fail]
        reason:
          type: string
        amount:
          type: number
        status:
          type: string
          enum: [pending_review, refunding, refunded, rejected]
        rejectReason:
          type: string
          nullable: true
        handledBy:
          type: string
          nullable: true
        handledAt:
          type: string
          nullable: true
        createdAt:
          type: string

    AdminTrip:
      allOf:
        - $ref: '#/components/schemas/Trip'
        - type: object
          properties:
            userName:
              type: string
            userId:
              type: integer

    AdminUser:
      type: object
      properties:
        id:
          type: integer
        nickname:
          type: string
        avatarUrl:
          type: string
          nullable: true
        phone:
          type: string
        wechatNickname:
          type: string
          nullable: true
        channel:
          type: string
          enum: [phone, wechat]
        tripCount:
          type: integer
        title:
          type: string
        spendTotal:
          type: number
        savedTotal:
          type: number
        status:
          type: string
          enum: [active, disabled]
        personalityType:
          type: string
          nullable: true
        lastLoginAt:
          type: string
          nullable: true
        createdAt:
          type: string

    AdminUserDetail:
      allOf:
        - $ref: '#/components/schemas/AdminUser'
        - type: object
          properties:
            recentMood:
              $ref: '#/components/schemas/Mood'
              nullable: true
            city:
              type: string
              nullable: true
            gender:
              type: integer
            stats:
              $ref: '#/components/schemas/UserStats'
            badges:
              type: array
              items:
                $ref: '#/components/schemas/Badge'
            recentOrders:
              type: array
              items:
                $ref: '#/components/schemas/AdminOrder'
            csNote:
              type: string
              nullable: true
            disableReason:
              type: string
              nullable: true

    Dashboard:
      type: object
      properties:
        metrics:
          type: object
          properties:
            openCount:
              type: integer
            gmv:
              type: number
            paySuccessRate:
              type: number
            newUsers:
              type: integer
            activeUsers:
              type: integer
        trend:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              openCount:
                type: integer
              gmv:
                type: number
              newUsers:
                type: integer
        todos:
          type: object
          properties:
            pendingPayExpired:
              type: integer
            pendingRefundReview:
              type: integer
            drawFailRefunds:
              type: integer
        topBoxes:
          type: array
          items:
            type: object
            properties:
              boxId:
                type: integer
              name:
                type: string
              openCount:
                type: integer
        topRoutes:
          type: array
          items:
            type: object
            properties:
              routeId:
                type: integer
              name:
                type: string
              drawCount:
                type: integer
        badgeUnlockRates:
          type: array
          items:
            type: object
            properties:
              badgeId:
                type: integer
              name:
                type: string
              rate:
                type: number

    AdminAccount:
      type: object
      properties:
        id:
          type: integer
        account:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/AdminRole'
        status:
          type: string
          enum: [active, disabled]
        lastLoginAt:
          type: string
          nullable: true

    AuditLog:
      type: object
      properties:
        id:
          type: integer
        adminId:
          type: integer
        adminName:
          type: string
        action:
          type: string
        target:
          type: string
        detail:
          type: string
        ip:
          type: string
        createdAt:
          type: string

    # ── 分页包装 ──
    PagedOrderResult:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  properties:
                    list:
                      type: array
                      items:
                        $ref: '#/components/schemas/OrderDetail'

    PagedTripResult:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageMeta'
                - type: object
                  properties:
                    list:
                      type: array
                      items:
                        $ref: '#/components/schemas/Trip'

    PagedBoxResult:
      allOf:
        - $ref: '#/components/schemas/Result'
        - type: object
          properties:
            data:
