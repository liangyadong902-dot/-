            type: string
            enum: [on, off]
        - name: badgeId
          in: query
          schema:
            type: integer
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 线路分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedRouteResult'
    post:
      tags: [管理端-配置]
      summary: 新增线路
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteUpsert'
