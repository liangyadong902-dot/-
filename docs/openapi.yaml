openapi: 3.0.3

info:
  title: 途个惊喜 API
  version: 1.0.0
  description: |
    用户端「原生微信小程序」与管理端「Vue3 Web」共用的业务 API。

    ## 约定
    - 用户端前缀 `/api/v1`，标注「需登录」的接口带用户 JWT。
    - 管理端前缀 `/api/v1/admin`，需管理员 JWT + 角色校验。
    - 统一响应体 `{ code, message, data }`，`code=0` 为成功。
    - **金额在接口层一律用「元」**（最多两位小数，`number` 类型）；
      数据库内部用「分」（`INT UNSIGNED`），换算只发生在适配层。
    - **时间一律用字符串**，格式 `yyyy-MM-dd HH:mm:ss`（北京时间，不用 UTC）。
    - 列表统一返回 `data: { list, total, page, pageSize }`。

    ## 与文档的关系
    本文件是接口契约的唯一真相（single source of truth）。
    `docs/接口设计.md` 是它的中文说明，两者必须同步修改。
    后端用 springdoc 从代码生成后与本文件比对，避免漂移。

servers:
  - url: http://localhost:8080
    description: 本地开发

tags:
  - name: 约定
    description: 公共响应结构与错误码
  - name: 用户端-账号
  - name: 用户端-内容
  - name: 用户端-订单与支付
  - name: 用户端-行程与我的
  - name: 用户端-AI
  - name: 用户端-社区
  - name: 用户端-打卡
  - name: 用户端-成就
  - name: 管理端-鉴权
  - name: 管理端-配置
  - name: 管理端-订单支付用户
  - name: 管理端-工作台与统计
  - name: 管理端-社区
  - name: 支付回调
    description: 第三方异步通知，不走统一响应体

security:
  - UserToken: []
  - AdminToken: []

paths:
  /api/v1/health:
    get:
      tags: [约定]
      summary: 健康检查
      security: []
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultString'
  # ═══════════════════════════════════════════════════════
  # 用户端 · 账号  （接口设计.md §2）
  # ═══════════════════════════════════════════════════════
  /api/v1/auth/sms/send:
    post:
      tags: [用户端-账号]
      summary: 发送短信验证码
      description: |
        第一期可固定码（`sys_config` 配置）或直接返回 mock。
        真实环境下同一手机号 60 秒内不允许重发。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  pattern: '^1[3-9]\d{9}$'
                  example: '13800138000'
      responses:
        '200':
          description: 发送成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/login/phone:
    post:
      tags: [用户端-账号]
      summary: 手机号登录（登录即注册）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone:
                  type: string
                  example: '13800138000'
                code:
                  type: string
                  example: '123456'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResult'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/auth/login/wechat:
    post:
      tags: [用户端-账号]
      summary: 微信登录
      description: |
        小程序 `wx.login` 拿到的 code → 后端 `code2session` → 换取 openid → 签发 JWT。
        需要 AppID + AppSecret；测试号可在开发者工具中跑通。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: wx.login 返回的 code
                nickname:
                  type: string
                  description: 用户授权或主动填写的昵称
                avatarUrl:
                  type: string
                  format: uri
                  description: 可公网访问的 HTTPS 头像地址
                gender:
                  type: integer
                  enum: [0, 1, 2]
                city:
                  type: string
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResult'

  /api/v1/auth/logout:
    post:
      tags: [用户端-账号]
      summary: 退出登录
      description: 可选：把当前 Token 加入 Redis 黑名单直到自然过期。
      responses:
        '200':
          description: 已退出
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'

  /api/v1/me:
    get:
      tags: [用户端-账号]
      summary: 当前用户资料
      description: 含称号（按出行次数套 `level.rules` 计算，不入库）。
      responses:
        '200':
          description: 用户资料
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [用户端-账号]
      summary: 修改我的资料
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname:
                  type: string
                  maxLength: 30
                avatarUrl:
                  type: string
                  maxLength: 512
                  pattern: '^https://'
                gender:
                  type: integer
                  enum: [0, 1, 2]
                  description: 0 未知 / 1 男 / 2 女
                city:
                  type: string
                  maxLength: 30
      responses:
        '200':
          description: 更新后的资料
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
    patch:
      $ref: '#/paths/~1api~1v1~1me/put'

  /api/v1/me/bind-phone:
    post:
      tags: [用户端-账号]
      summary: 微信用户补绑手机号
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: 绑定成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '409':
          description: 该手机号已被其他账号绑定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'

  # ═══════════════════════════════════════════════════════
  # 用户端 · 内容  （接口设计.md §3）
  # ═══════════════════════════════════════════════════════
  /api/v1/banners:
    get:
      tags: [用户端-内容]
      summary: 当前有效 Banner
      description: 按 `status=on` 且在 `start_at`~`end_at` 区间内、按 `sort_weight` 倒序。
      security: []
      responses:
        '200':
          description: Banner 列表（不分页）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Banner'

  /api/v1/boxes:
    get:
      tags: [用户端-内容]
      summary: 上架盲盒列表
      description: |
        `category` 与 `mood` 可叠加过滤。
        心情过滤走 `blind_box_mood` 关联表；分类过滤走 `blind_box.category`。
      security: []
      parameters:
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/Category'
          description: 不传或传 all 表示全部
        - name: mood
          in: query
          schema:
            $ref: '#/components/schemas/Mood'
          description: 不传或传 all 表示不按心情过滤
      responses:
        '200':
          description: 盲盒列表（不分页，首页一次性返回）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/BlindBox'

  /api/v1/boxes/{id}:
    get:
      tags: [用户端-内容]
      summary: 盲盒详情
      security: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 盲盒详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BlindBox'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/badges:
    get:
      tags: [用户端-内容]
      summary: 全部徽章定义
      description: 未登录时 `unlocked` 全为 false；登录时按 `user_badge` 标记。
      security: []
      responses:
        '200':
          description: 徽章列表（含总数，供进度条分母）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          total:
                            type: integer
                            example: 12
                          list:
                            type: array
                            items:
                              $ref: '#/components/schemas/Badge'

  /api/v1/mood-logs:
    post:
      tags: [用户端-内容]
      summary: 记录心情选择
      description: 游客也记（`user_id` 可空），用于管理端心情分布统计。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mood]
              properties:
                mood:
                  $ref: '#/components/schemas/Mood'
                boxId:
                  type: integer
                  nullable: true
                  description: 当时是否连带筛选了某个盲盒
      responses:
        '200':
          description: 记录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'

  /api/v1/personality/questions:
    get:
      tags: [用户端-内容]
      summary: 人格测试题目
      description: 仅返回启用题目和选项，不返回计分 JSON。
      security: []
      responses:
        '200':
          description: 动态题目列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PersonalityQuestion'

  /api/v1/personality/submit:
    post:
      tags: [用户端-内容]
      summary: 提交人格测试
      description: 游客仅返回结果；登录用户同时保存作答并更新用户人格。
      security:
        - {}
        - UserToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items: { type: integer, minimum: 0 }
                durationMs:
                  type: integer
                  nullable: true
      responses:
        '200':
          description: 人格结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PersonalityResult'

  /api/v1/personality/my-result:
    get:
      tags: [用户端-内容]
      summary: 当前用户最近一次人格结果
      responses:
        '200':
          description: 未测试时 data 为 null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PersonalityResult'
                        nullable: true

  /api/v1/ai/config:
    get:
      tags: [用户端-AI]
      summary: 小途开场白与快捷问题
      security: []
      responses:
        '200':
          description: AI 页面公开配置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AiConfig'

  /api/v1/ai/messages:
    get:
      tags: [用户端-AI]
      summary: 最近聊天消息
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 16, maximum: 50 }
      responses:
        '200':
          description: 按时间正序返回
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ChatMessage'

  /api/v1/ai/chat:
    post:
      tags: [用户端-AI]
      summary: 与小途整段对话
      security:
        - {}
        - UserToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 2000 }
                viaQuick: { type: boolean, default: false }
                sessionId:
                  type: string
                  maxLength: 64
                  nullable: true
                  description: 游客后续请求回传；登录用户忽略
      responses:
        '200':
          description: 模型或降级回复
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AiReply'

  /api/v1/ai/chat/stream:
    get:
      tags: [用户端-AI]
      summary: 调试用 SSE 对话
      description: 返回单个 `message` 事件；小程序正式流程不依赖此接口。
      security:
        - {}
        - UserToken: []
      parameters:
        - name: text
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 2000 }
        - name: viaQuick
          in: query
          schema: { type: boolean, default: false }
        - name: sessionId
          in: query
          schema: { type: string, maxLength: 64, nullable: true }
      responses:
        '200':
          description: "data 为 AiReply 的 SSE message 事件"
          content:
            text/event-stream:
              schema: { type: string }

  # ═══════════════════════════════════════════════════════
  # 用户端 · 订单与支付
  # ═══════════════════════════════════════════════════════
  /api/v1/orders:
    get:
      tags: [用户端-订单与支付]
      summary: 我的订单列表
      parameters:
        - $ref: '#/components/parameters/StatusQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 订单列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedOrderResult'
    post:
      tags: [用户端-订单与支付]
      summary: 创建待支付订单
      description: |
        一单一盒。同一用户对同一盲盒存在 `pending_pay` / `paid` 订单时返回 409。
        盲盒下单时写入名称、售价、保底、分类快照；默认 15 分钟过期。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [boxId]
              properties:
                boxId:
                  type: integer
                  format: int64
      responses:
        '200':
          description: 订单创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OrderCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 已有未完成订单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orderNo:
                            type: string

  /api/v1/orders/{orderNo}:
    get:
      tags: [用户端-订单与支付]
      summary: 查询订单详情与开盒结果
      description: 支付回站后由小程序轮询，直到 `opened` 或 `refunded`。
      parameters:
        - $ref: '#/components/parameters/OrderNo'
      responses:
        '200':
          description: 订单详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OrderDetail'

  /api/v1/orders/{orderNo}/cancel:
    post:
      tags: [用户端-订单与支付]
      summary: 取消待支付订单
      parameters:
        - $ref: '#/components/parameters/OrderNo'
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/orders/{orderNo}/pay:
    post:
      tags: [用户端-订单与支付]
      summary: 创建支付宝沙箱支付跳转信息
      description: |
        返回 `payForm` / 支付跳转 URL；此接口**不**把订单改为已支付。
        原生小程序不能把 payForm 放进页面自动提交，也不能直接调起支付宝。
        本期确定采用「沙箱 + 外部浏览器/二维码」：小程序展示订单与支付二维码或支付链接，
        演示者在浏览器完成沙箱付款；小程序回到前台后继续轮询订单。
      parameters:
        - $ref: '#/components/parameters/OrderNo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel:
                  type: string
                  enum: [alipay]
                  default: alipay
      responses:
        '200':
          description: 支付跳转信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PayRedirect'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/pay/notify/alipay:
    post:
      tags: [支付回调]
      summary: 支付宝异步通知
      description: RSA2 验签、核对订单与金额、记录幂等 notify_id，成功后订单 paid 并执行开盒事务。
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: { type: string }
      responses:
        '200':
          description: 必须返回纯文本 success
          content:
            text/plain:
              schema:
                type: string
                example: success

  /api/v1/orders/{orderNo}/refund:
    post:
      tags: [用户端-订单与支付]
      summary: 申请退换
      parameters:
        - $ref: '#/components/parameters/OrderNo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, kind]
              properties:
                reason:
                  type: string
                  maxLength: 255
                kind:
                  type: string
                  enum: [value_guard, unused]
      responses:
        '200':
          description: 已提交审核
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '409':
          $ref: '#/components/responses/Conflict'

  # ═══════════════════════════════════════════════════════
  # 用户端 · 行程与我的
  # ═══════════════════════════════════════════════════════
  /api/v1/trips:
    get:
      tags: [用户端-行程与我的]
      summary: 我的有效行程列表
      parameters:
        - name: validity
          in: query
          schema:
            type: string
            enum: [valid, invalid]
            default: valid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 行程列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedTripResult'

  /api/v1/trips/{id}:
    get:
      tags: [用户端-行程与我的]
      summary: 行程详情
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 行程快照
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Trip'

  /api/v1/trips/{id}/diary:
    post:
      tags: [用户端-行程与我的]
      summary: 生成旅行日记
      description: 已生成时直接返回已有日记，保证幂等。
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 日记内容
          content:
