  /api/v1/admin/ai/diary-templates/{id}:
    put:
      tags: [管理端-AI]
      summary: 修改日记模板
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiaryTemplateAdmin' }
      responses: { '200': { description: 已修改 } }
    delete:
      tags: [管理端-AI]
      summary: 删除日记模板
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses: { '200': { description: 已删除 } }

  /api/v1/admin/personality/questions:
    get:
      tags: [管理端-人格]
      summary: 题目与计分选项列表
      responses: { '200': { description: 列表 } }
    post:
      tags: [管理端-人格]
      summary: 新增题目
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPersonalityQuestion' }
      responses: { '200': { description: 已新增 } }

  /api/v1/admin/personality/questions/{id}:
    put:
      tags: [管理端-人格]
      summary: 修改题目
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPersonalityQuestion' }
      responses: { '200': { description: 已修改 } }
    delete:
      tags: [管理端-人格]
      summary: 删除未被作答引用的题目
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses: { '200': { description: 已删除 }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/v1/admin/personality/questions/{questionId}/options:
    post:
      tags: [管理端-人格]
      summary: 新增选项
      parameters: [{ $ref: '#/components/parameters/QuestionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPersonalityOption' }
      responses: { '200': { description: 已新增 } }

  /api/v1/admin/personality/options/{id}:
    put:
      tags: [管理端-人格]
      summary: 修改选项与计分
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPersonalityOption' }
      responses: { '200': { description: 已修改 } }
    delete:
      tags: [管理端-人格]
      summary: 删除未被作答引用的选项
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses: { '200': { description: 已删除 }, '409': { $ref: '#/components/responses/Conflict' } }

  /api/v1/admin/personality/results:
    get:
      tags: [管理端-人格]
      summary: 人格结果定义列表
      responses: { '200': { description: 列表 } }
    post:
      tags: [管理端-人格]
      summary: 新增人格结果
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPersonalityResult' }
      responses: { '200': { description: 已新增 } }

  /api/v1/admin/personality/results/{id}:
    put:
      tags: [管理端-人格]
      summary: 修改人格结果
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminPersonalityResult' }
      responses: { '200': { description: 已修改 } }
    delete:
      tags: [管理端-人格]
      summary: 删除未被作答引用的人格结果
      parameters: [{ $ref: '#/components/parameters/PathId' }]
      responses: { '200': { description: 已删除 }, '409': { $ref: '#/components/responses/Conflict' } }

components:
  securitySchemes:
    UserToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 用户端 JWT，前缀 /api/v1
    AdminToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 管理端 JWT，前缀 /api/v1/admin

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    QuestionId:
      name: questionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    OrderNo:
      name: orderNo
      in: path
      required: true
      schema:
        type: string
        example: T20260917001234
    RefundNo:
      name: refundNo
      in: path
      required: true
      schema:
        type: string
        example: R20260917001001
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    StatusQuery:
      name: status
      in: query
      schema:
        type: string
        enum: [pending_pay, paid, opened, cancelled, refunded]
    DateRangeBegin:
      name: begin
      in: query
      schema:
        type: string
        format: date
        example: '2026-09-01'
    DateRangeEnd:
      name: end
      in: query
      schema:
        type: string
        format: date
        example: '2026-09-18'

  responses:
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'
    Unauthorized:
      description: 未登录或 Token 失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'
    Forbidden:
      description: 无权限或账号被禁用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'
    Conflict:
      description: 状态冲突，当前状态不允许该操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'

  schemas:
    # ── 公共 ──
    Result:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
        requestId:
          type: string
          description: 请求追踪 ID
          example: ok
    ResultVoid:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
        data:
          type: object
          nullable: true
    ResultString:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: string

    Category:
      type: string
      description: 周边游 / 省内游 / 跨省游 / 主题专线
      enum: [nearby, province, cross, theme]
    Mood:
      type: string
      description: 开心 / emo / 无聊 / 迷茫
      enum: [happy, emo, bored, curious]

    # ── 用户端 ──
    LoginResult:
      type: object
      properties:
        token:
          type: string
        isNewUser:
          type: boolean
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nickname:
          type: string
        avatarUrl:
          type: string
          nullable: true
        gender:
          type: integer
          enum: [0, 1, 2]
        city:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
          description: 脱敏，如 138****8000
        hasPhone:
          type: boolean
        wechatOpenidBound:
          type: boolean
        title:
          type: string
          description: 称号，按出行次数套 level.rules 算出，不落库
          example: 探索者
        personalityType:
          type: string
          nullable: true
          enum: [nature, city, adventure, culture, null]
        version:
          type: integer

    Banner:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        subTitle:
          type: string
        tag:
          type: string
        imageUrl:
          type: string
        jumpType:
          type: string
          enum: [none, category, box, url]
        jumpTarget:
          type: string
          nullable: true

    BlindBox:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        tag:
          type: string
          description: 展示用分类标签，如「周边游」
        rankTag:
          type: string
          nullable: true
          description: 角标，如 TOP1 / HOT / NEW
        intro:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: number
          description: 售价（元）
          example: 99
        minValue:
          type: number
          description: 保底票面（元）
          example: 120
        coverUrl:
          type: string
        imageUrls:
          type: array
          items: { type: string }
        moods:
          type: array
          items:
            $ref: '#/components/schemas/Mood'
        includes:
          type: array
          items: { type: string }
        guidePreview:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [on, off]
        openCount:
          type: integer
        version:
          type: integer

    Badge:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: 古村
        mark:
          type: string
          description: 印章内的单字
          example: 村
        description:
          type: string
        unlocked:
          type: boolean
        unlockedAt:
          type: string
          nullable: true

    PersonalityQuestion:
      type: object
      properties:
        id:
          type: integer
        sortNo:
          type: integer
        question:
          type: string
        options:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              text:
                type: string

    PersonalityResult:
      type: object
      properties:
        type:
          type: string
          enum: [nature, city, adventure, culture]
        name:
          type: string
          example: 山野治愈家
        mark:
          type: string
          example: 野
        description:
          type: string
        recommend:
          type: string

    AiConfig:
      type: object
      properties:
        greet:
          type: string
        quickQuestions:
          type: array
          items:
            type: string

    ChatMessage:
      type: object
      properties:
        id:
          type: integer
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        fallback:
          type: boolean
        createdAt:
          type: string

    AiReply:
      type: object
      properties:
        content:
          type: string
        fallback:
          type: boolean
          description: true 表示走了关键词 / 默认话术降级
        recommendBoxes:
          type: array
          items:
            $ref: '#/components/schemas/BlindBox'
        sessionId:
          type: string
          nullable: true

    DiaryResult:
      type: object
      required: [diaryText, fallback]
      properties:
        diaryText:
          type: string
        fallback:
          type: boolean

    AdminAiConfig:
      type: object
      required: [greet, systemPrompt, diaryPrompt, enabled, toolsEnabled, fallbackEnabled]
      description: 不含 API Key、base URL 或模型 endpoint。
      properties:
        greet: { type: string, minLength: 1, maxLength: 500 }
        systemPrompt: { type: string, minLength: 1, maxLength: 4000 }
        diaryPrompt: { type: string, minLength: 1, maxLength: 2000 }
        enabled: { type: boolean }
        toolsEnabled: { type: boolean }
        fallbackEnabled: { type: boolean }

    AiQuickQuestionAdmin:
      type: object
      required: [text]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        text: { type: string, minLength: 1, maxLength: 128 }
        sortWeight: { type: integer, default: 0 }
        status: { type: string, enum: [on, off], default: on }
        createdAt: { type: string, readOnly: true }
        updatedAt: { type: string, readOnly: true }

    AiKeywordRuleAdmin:
      type: object
      required: [keywords, replyText]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        keywords:
          type: array
          minItems: 1
          items: { type: string, minLength: 1, maxLength: 64 }
        replyText: { type: string, minLength: 1, maxLength: 500 }
        recommendBoxIds:
          type: array
          items: { type: integer, format: int64 }
        sortWeight: { type: integer, default: 0 }
        status: { type: string, enum: [on, off], default: on }
        createdAt: { type: string, readOnly: true }
        updatedAt: { type: string, readOnly: true }

    AiDefaultReplyAdmin:
      type: object
      required: [text]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        text: { type: string, minLength: 1, maxLength: 500 }
        sortWeight: { type: integer, default: 0 }
        status: { type: string, enum: [on, off], default: on }
        createdAt: { type: string, readOnly: true }
        updatedAt: { type: string, readOnly: true }

    DiaryTemplateAdmin:
      type: object
      required: [content]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        content: { type: string, minLength: 1, maxLength: 4000 }
        sortWeight: { type: integer, default: 0 }
        status: { type: string, enum: [on, off], default: on }
        createdAt: { type: string, readOnly: true }
        updatedAt: { type: string, readOnly: true }

    AdminPersonalityOption:
      type: object
      required: [seq, label, score]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        questionId: { type: integer, format: int64, readOnly: true }
        seq: { type: integer, minimum: 1 }
        label: { type: string, minLength: 1, maxLength: 128 }
        score:
          type: object
          minProperties: 1
          additionalProperties: { type: integer, minimum: 0 }

    AdminPersonalityQuestion:
      type: object
      required: [seq, stem]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        seq: { type: integer, minimum: 1 }
        stem: { type: string, minLength: 1, maxLength: 255 }
        status: { type: string, enum: [on, off], default: on }
        options:
          type: array
          readOnly: true
          items: { $ref: '#/components/schemas/AdminPersonalityOption' }
        updatedAt: { type: string, readOnly: true }

    AdminPersonalityResult:
      type: object
      required: [type, name, mark, description, recommend]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        type: { type: string, enum: [nature, city, adventure, culture] }
        name: { type: string, minLength: 1, maxLength: 32 }
        mark: { type: string, minLength: 1, maxLength: 4 }
        description: { type: string, minLength: 1, maxLength: 255 }
        recommend: { type: string, minLength: 1, maxLength: 255 }

    AdminUserStats:
      type: object
      properties:
        users:
          type: object
          properties:
            registered: { type: integer }
            new: { type: integer }
            active: { type: integer }
        funnel:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              count: { type: integer, nullable: true }
              rate: { type: number, nullable: true }
        titleDistribution:
          type: object
          additionalProperties: { type: integer }
        moodDistribution:
          type: object
          additionalProperties: { type: integer }
        ai:
          type: object
          properties:
            userCount: { type: integer }
            messageCount: { type: integer }
            fallbackCount: { type: integer }
            fallbackRate: { type: number }

    AdminPayStats:
      type: object
      properties:
        orderCount: { type: integer }
        paidOrderCount: { type: integer }
        gmv: { type: number }
        averageOrderValue: { type: number, nullable: true }
        refundCount: { type: integer }
        refundAmount: { type: number }
        refundRate: { type: number }
        channels:
          type: array
          items:
            type: object
            properties:
              channel: { type: string }
              count: { type: integer }

    AdminContentStats:
      type: object
      properties:
        openCount: { type: integer }
        boxStats:
          type: array
          items: { $ref: '#/components/schemas/AdminNamedMetric' }
        routeStats:
          type: array
          items: { $ref: '#/components/schemas/AdminNamedMetric' }

    AdminNamedMetric:
      type: object
      properties:
        name: { type: string }
        count: { type: integer }

    OrderCreated:
      type: object
      properties:
        orderNo:
          type: string
        amount:
          type: number
        expireAt:
          type: string

    PayRedirect:
      type: object
      properties:
        channel:
          type: string
          enum: [alipay, mock]
        payUrl:
          type: string
          description: 沙箱收银台地址，供外部浏览器 / 二维码使用
        payForm:
          type: string
          nullable: true
          description: 支付宝返回的表单 HTML；H5 场景可直接提交
        qrCodeUrl:
          type: string
          nullable: true
          description: 后端渲染的支付二维码图片地址
        expireAt:
          type: string

    OrderDetail:
      type: object
      properties:
        orderNo:
          type: string
        status:
          type: string
          enum: [pending_pay, paid, opened, cancelled, refunded]
        boxId:
          type: integer
        boxName:
          type: string
          description: 下单时快照
        boxCategory:
          $ref: '#/components/schemas/Category'
        amount:
          type: number
        payChannel:
          type: string
          nullable: true
          enum: [alipay, mock, null]
        paidAt:
          type: string
          nullable: true
        expireAt:
          type: string
        createdAt:
          type: string
        trip:
          type: object
          allOf:
            - $ref: '#/components/schemas/Trip'
          nullable: true
        refundStatus:
          type: string
          nullable: true
          enum: [pending_review, refunding, refunded, rejected, null]

    Trip:
      type: object
      properties:
        id:
          type: integer
        orderNo:
          type: string
        boxName:
          type: string
        boxCategory:
          $ref: '#/components/schemas/Category'
        routeName:
          type: string
          description: 开盒时快照
        destination:
          type: string
        value:
          type: number
          description: 票面价值（元）
        price:
          type: number
          description: 购入价（元）
        badgeName:
          type: string
        badgeMark:
          type: string
        moodText:
          type: string
        highlights:
          type: string
        includes:
          type: array
          items:
            type: string
        openedAt:
          type: string
        validity:
          type: boolean
          description: false 表示已随退款失效
        diaryText:
          type: string
          nullable: true

    UserStats:
      type: object
      description: 口径见数据库设计 §5
      properties:
        tripCount:
          type: integer
          description: 有效行程数
        savedTotal:
          type: number
          description: 累计省钱 = Σ(票面 − 购入价)，仅有效行程
        levelNo:
          type: integer
          description: 当前等级数字，max(1, tripCount)
        title:
          type: string
        welfareKm:
          type: number
          description: 公益里程，按有效行程累计
        badgeUnlocked:
          type: integer
        badgeTotal:
          type: integer
        personalityType:
          type: string
          nullable: true
        destinations:
          type: array
          items:
            type: string
        destinationCount:
          type: integer
          description: 有效行程目的地去重数量
        spendTotal:
          type: number
          description: 累计消费，仅支付成功且未退款
        recentMood:
          $ref: '#/components/schemas/Mood'
          nullable: true
        favoriteCategory:
          $ref: '#/components/schemas/Category'
          nullable: true
        monthTrips:
          type: integer
        diaryCount:
          type: integer

    # ── Phase 5 社交域 ──
    PostCreateRequest:
      type: object
      required: [title, content]
      properties:
        title: { type: string, minLength: 1, maxLength: 30 }
        content: { type: string, minLength: 1, maxLength: 500 }
        imageUrls: { type: array, maxItems: 9, items: { type: string, maxLength: 500 } }
        topicId: { type: integer, format: int64, nullable: true }
        locationName: { type: string, maxLength: 100, nullable: true }
        publicLocation: { type: boolean, default: false }
        latitude: { type: number, format: double, nullable: true }
        longitude: { type: number, format: double, nullable: true }
        linkedBlindBoxId: { type: integer, format: int64, nullable: true }
        linkedTripId: { type: integer, format: int64, nullable: true }
        linkedCheckinId: { type: integer, format: int64, nullable: true }
    CommentCreateRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 500 }
        parentCommentId: { type: integer, format: int64, nullable: true }
        replyToUserId: { type: integer, format: int64, nullable: true }
    CheckinCreateRequest:
      type: object
      required: [tripId, locationName]
      properties:
        tripId: { type: integer, format: int64 }
        locationName: { type: string, minLength: 1, maxLength: 100 }
        publicLocation: { type: boolean, default: false }
        latitude: { type: number, format: double, nullable: true }
        longitude: { type: number, format: double, nullable: true }
        imageUrls: { type: array, minItems: 1, maxItems: 9, items: { type: string, maxLength: 500 } }
        note: { type: string, maxLength: 500, nullable: true }
    SocialUser:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        nickname: { type: string }
        avatarUrl: { type: string, nullable: true }
        city: { type: string, nullable: true }
        followed: { type: boolean }
        followerCount: { type: integer, format: int64 }
    CommunityPost:
      type: object
      properties:
        postId: { type: integer, format: int64 }
        title: { type: string }
        content: { type: string }
        imageUrls: { type: array, items: { type: string } }
        author: { $ref: '#/components/schemas/SocialUser' }
        topic: { type: object, nullable: true }
        locationName: { type: string, nullable: true }
        publicLocation: { type: boolean }
        linkedBox: { type: object, nullable: true }
        linkedTrip: { type: object, nullable: true }
        linkedCheckin: { type: object, nullable: true }
        likeCount: { type: integer }
        collectCount: { type: integer }
        commentCount: { type: integer }
        shareCount: { type: integer }
        liked: { type: boolean }
        collected: { type: boolean }
        status: { type: string, enum: [review, published, featured, down, deleted] }
        createdAt: { type: string }
        updatedAt: { type: string, nullable: true }
    PagedCommunityPostResult:
      type: object
      properties:
        list: { type: array, items: { $ref: '#/components/schemas/CommunityPost' } }
        total: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }
        hasMore: { type: boolean }
    AdminContentStatusRequest:
      type: object
      required: [toStatus]
      properties:
        toStatus: { type: string }
        reason: { type: string, maxLength: 255 }
