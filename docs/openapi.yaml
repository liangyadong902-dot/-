  # 管理端 · 内容配置 CRUD  （接口设计.md §7）
  # ═══════════════════════════════════════════════════════
  /api/v1/admin/boxes:
    get:
      tags: [管理端-配置]
      summary: 盲盒列表（含下架）
      parameters:
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/Category'
        - name: status
          in: query
          schema:
            type: string
            enum: [on, off]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 盲盒分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedBoxResult'
    post:
      tags: [管理端-配置]
      summary: 新增盲盒
      description: 保存时校验同分类启用线路中是否存在满足保底的线路，不满足时返回告警字段但允许保存。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoxUpsert'
      responses:
        '200':
          description: 新建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminBox'

  /api/v1/admin/boxes/{id}:
    put:
      tags: [管理端-配置]
      summary: 修改盲盒
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoxUpsert'
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminBox'
    delete:
      tags: [管理端-配置]
      summary: 删除盲盒
      description: 存在未完成订单时返回 409，禁止删除。
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/admin/boxes/{id}/status:
    patch:
      tags: [管理端-配置]
      summary: 盲盒上/下架
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [on, off]
      responses:
        '200':
          description: 已切换
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'

  /api/v1/admin/boxes/{id}/pool:
    get:
      tags: [管理端-配置]
      summary: 盲盒可抽线路池预览
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 线路池及是否满足保底
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          ok:
                            type: boolean
                            description: 是否存在 value_cent >= min_value_cent 的启用线路
                          routes:
                            type: array
                            items:
                              $ref: '#/components/schemas/AdminRoute'

  /api/v1/admin/routes:
    get:
      tags: [管理端-配置]
      summary: 线路列表
      parameters:
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/Category'
        - name: status
          in: query
