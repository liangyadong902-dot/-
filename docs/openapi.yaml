  # ═══════════════════════════════════════════════════════
  # 管理端 · 订单 / 退款 / 流水 / 行程 / 用户  （接口设计.md §8）
  # ═══════════════════════════════════════════════════════
  /api/v1/admin/orders:
    get:
      tags: [管理端-订单支付用户]
      summary: 订单列表
      parameters:
        - $ref: '#/components/parameters/StatusQuery'
        - name: keyword
          in: query
          schema:
            type: string
            description: 订单号 / 用户昵称 / 手机号
        - name: boxId
          in: query
          schema:
            type: integer
        - name: channel
          in: query
          schema:
            type: string
            enum: [alipay, mock]
        - name: begin
          in: query
          schema:
            type: string
            format: date
        - name: end
          in: query
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 订单分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAdminOrderResult'

  /api/v1/admin/orders/export:
    get:
      tags: [管理端-订单支付用户]
      summary: 导出订单明细
      description: 仅 finance / super_admin / analyst 可下载。
      parameters:
        - $ref: '#/components/parameters/StatusQuery'
        - name: begin
          in: query
          schema:
            type: string
            format: date
        - name: end
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: CSV 文件流
          content:
            text/csv:
              schema:
                type: string

  /api/v1/admin/orders/{orderNo}:
    get:
      tags: [管理端-订单支付用户]
      summary: 订单详情
      parameters:
        - $ref: '#/components/parameters/OrderNo'
      responses:
        '200':
          description: 订单详情（含支付、开盒、退款）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminOrderDetail'

  /api/v1/admin/orders/{orderNo}/reopen:
    post:
      tags: [管理端-订单支付用户]
      summary: 补单
      description: 仅 `paid` 且 `trip_id` 为空时可补抽。
      parameters:
        - $ref: '#/components/parameters/OrderNo'
      responses:
        '200':
          description: 补抽完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/admin/refunds:
    get:
      tags: [管理端-订单支付用户]
      summary: 退款单列表
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending_review, refunding, refunded, rejected]
        - name: kind
          in: query
          schema:
            type: string
            enum: [value_guard, unused, draw_fail]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 退款单分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedRefundResult'

  /api/v1/admin/refunds/{refundNo}:
    get:
      tags: [管理端-订单支付用户]
      summary: 退款单详情
      parameters:
        - $ref: '#/components/parameters/RefundNo'
      responses:
        '200':
          description: 退款单详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RefundDetail'

  /api/v1/admin/refunds/{refundNo}/approve:
    post:
      tags: [管理端-订单支付用户]
      summary: 退款审核通过（原路退回）
      description: 通过后订单 `refunded`，关联行程 `invalid`；不改动已发放徽章与已计里程。
      parameters:
        - $ref: '#/components/parameters/RefundNo'
      responses:
        '200':
          description: 已通过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/admin/refunds/{refundNo}/reject:
    post:
      tags: [管理端-订单支付用户]
      summary: 退款驳回
      parameters:
        - $ref: '#/components/parameters/RefundNo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 255
      responses:
        '200':
          description: 已驳回
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'

  /api/v1/admin/pay-flows:
    get:
      tags: [管理端-订单支付用户]
      summary: 支付流水列表
      parameters:
        - name: orderNo
          in: query
          schema:
            type: string
        - name: result
          in: query
          schema:
            type: string
            enum: [success, fail]
        - name: channel
          in: query
          schema:
            type: string
            enum: [alipay, mock]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 支付流水分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPayFlowResult'

  /api/v1/admin/trips:
    get:
      tags: [管理端-订单支付用户]
      summary: 行程记录（只读）
      parameters:
        - name: validity
          in: query
          schema:
            type: string
            enum: [valid, invalid]
        - name: routeId
          in: query
          schema:
            type: integer
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 行程分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAdminTripResult'

  /api/v1/admin/users:
    get:
      tags: [管理端-订单支付用户]
      summary: 用户列表
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
            description: 昵称 / 手机号 / 微信昵称
        - name: status
          in: query
          schema:
            type: string
            enum: [active, disabled]
        - name: channel
          in: query
          schema:
            type: string
            enum: [phone, wechat]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 用户分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAdminUserResult'

  /api/v1/admin/users/export:
    get:
      tags: [管理端-订单支付用户]
      summary: 导出用户明细
      responses:
        '200':
          description: CSV 文件流
          content:
            text/csv:
              schema:
                type: string

  /api/v1/admin/users/{id}:
    get:
      tags: [管理端-订单支付用户]
      summary: 用户详情（四层档案）
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 身份 / 资料偏好 / 资产行为 / 成长统计 / 内部
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdminUserDetail'

  /api/v1/admin/users/{id}/status:
    patch:
      tags: [管理端-订单支付用户]
      summary: 禁用 / 启用用户
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, disabled]
